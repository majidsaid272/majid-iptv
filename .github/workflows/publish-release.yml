name: Publish draft release

# Makes an already-uploaded draft release public and marks it as latest,
# so the download button on the page works. Triggered by editing
# .github/publish-release.json on main.
on:
  push:
    branches: [main]
    paths:
      - '.github/publish-release.json'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(jq -r .tag .github/publish-release.json)
          gh release edit "$TAG" -R "${{ github.repository }}" --draft=false --latest
          gh api "repos/${{ github.repository }}/releases/latest" --jq '"Latest: \(.tag_name) draft=\(.draft) assets=\([.assets[].name] | join(","))"'
